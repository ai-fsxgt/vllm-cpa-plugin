name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux AMD64 plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Build Linux AMD64 plugin
        env:
          CGO_ENABLED: "1"
          GOARCH: amd64
          GOOS: linux
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -buildmode=c-shared \
            -o dist/vllm-reasoning-normalizer-linux-amd64.so \
            .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/vllm-reasoning-normalizer-linux-amd64.so \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
